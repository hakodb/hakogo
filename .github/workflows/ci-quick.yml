# Quick gate for branch protection (required check on main).
# Answers one question fast: does it still build?

name: ci-quick

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: quick-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # ponytail: library packages only — examples/demo links the
      # prebuilt native lib (third_party, MSVC-built, absent here).
      # Demo breakage is caught at release packaging, not the gate.
      - name: build
        run: go build ./hako/...
